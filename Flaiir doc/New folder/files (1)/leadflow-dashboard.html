<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LeadFlow — Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
<style>
/* ============ TOKENS ============ */
:root{
  --paper:#FBFBF9; --paper-2:#F4F5F0; --card:#FFFFFF;
  --ink:#15201A; --ink-2:#3A463F;
  --slate:#6B7669; --slate-2:#9AA398; --line:#E4E7DF; --line-2:#EEF0EA;
  --lime:#C4F000; --lime-deep:#7E9E0A; --lime-dim:#F2FAD6; --lime-ink:#3D4D08;
  --sidebar:#16201B; --sidebar-2:#1F2C25; --sidebar-line:#2B3A31;
  /* source colors */
  --reddit:#FF5A3C; --reed:#3B7BE0; --wwr:#E8A020; --rok:#9B6BE0;
  /* score colors */
  --hi:#5BA02E; --hi-bg:#EAF5E0; --mid:#D8920A; --mid-bg:#FBF1DC; --lo:#9AA398; --lo-bg:#F0F1EC;
  --coral:#E5573D;
  --r-sm:7px; --r-md:11px; --r-lg:15px; --r-xl:20px; --r-pill:999px;
  --sh-sm:0 1px 2px rgba(21,32,26,.04),0 1px 3px rgba(21,32,26,.03);
  --sh-md:0 2px 8px rgba(40,55,30,.05),0 10px 28px rgba(40,55,30,.06);
  --sh-warm:0 8px 24px rgba(255,106,61,.18);
  --sh-lg:0 12px 40px rgba(21,32,26,.14);
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.34,1.4,.5,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;overflow:hidden}
.ti{font-weight:600;display:inline-block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:2px solid var(--paper)}
::-webkit-scrollbar-thumb:hover{background:var(--slate-2)}
:focus-visible{outline:2px solid var(--lime-deep);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.mono{font-family:var(--mono)}
.display{font-family:'Space Grotesk',sans-serif;letter-spacing:-.02em}

/* ===== TYPE SCALE — Typography lesson: derive scale from 16px body; line-height ~1.5x for
   paragraphs and tighter for headings; cap reading line length to 45–75 chars ===== */
:root{
  --lh-body:1.55;   /* ≈1.5x body for comfortable reading */
  --lh-head:1.2;    /* tighter for headings so they stand out */
  --measure:68ch;   /* keeps reading text within the 45–75 char guideline */
}
.prose{max-width:var(--measure);line-height:var(--lh-body)}

/* ===== TOOLTIP — Info-components lesson: clarify icon-only controls on hover/focus ===== */
.tip{position:relative}
.tip::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 7px);left:50%;
  transform:translateX(-50%) translateY(3px);background:var(--ink);color:#fff;font-size:11.5px;font-weight:500;
  line-height:1.3;white-space:nowrap;padding:5px 9px;border-radius:6px;opacity:0;pointer-events:none;
  transition:opacity .14s,transform .14s;z-index:90}
.tip::before{content:"";position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:var(--ink);opacity:0;transition:opacity .14s;z-index:90}
.tip:hover::after,.tip:focus-visible::after{opacity:1;transform:translateX(-50%) translateY(0)}
.tip:hover::before,.tip:focus-visible::before{opacity:1}

/* ===== SKELETON LOADER — Info lesson: loaders tell users an action/load is in progress ===== */
.skel{background:linear-gradient(100deg,var(--line-2) 30%,#F8F9F5 50%,var(--line-2) 70%);
  background-size:200% 100%;animation:shimmer 1.3s infinite;border-radius:6px}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.skel-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:12px}
.skel-line{height:11px;margin-bottom:9px}

/* ===== BREADCRUMBS — Nav lesson: show location within hierarchy and a way back ===== */
.crumbs{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--slate);margin-bottom:14px}
.crumbs a{color:var(--slate);font-weight:500}
.crumbs a:hover{color:var(--ink)}
.crumbs .sep{color:var(--slate-2)}
.crumbs .here{color:var(--ink);font-weight:600}

/* ============ APP SHELL ============ */
#app{display:grid;grid-template-columns:236px 1fr;height:100vh;width:100vw}

/* ---- Sidebar ---- */
#rail{background:var(--sidebar);display:flex;flex-direction:column;padding:18px 14px;gap:4px;position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--lime);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-mark span{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--sidebar)}
.brand-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;color:#fff;letter-spacing:-.02em}
.rail-label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r-sm);color:#A9B5AC;font-size:14px;font-weight:500;width:100%;text-align:left;transition:background .15s,color .15s;position:relative}
.nav-item .ti{font-size:19px}
.nav-item:hover{background:var(--sidebar-2);color:#E8EDE9}
.nav-item.active{background:var(--sidebar-2);color:#fff}
.nav-item.active::before{content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--lime);border-radius:0 3px 3px 0}
.nav-badge{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:600;background:var(--lime);color:var(--sidebar);padding:1px 7px;border-radius:var(--r-pill)}
.rail-spacer{flex:1}
.rail-foot{border-top:1px solid var(--sidebar-line);padding-top:12px;margin-top:8px}
.usage-mini{padding:10px 11px;background:var(--sidebar-2);border-radius:var(--r-md);margin-bottom:8px}
.usage-mini .um-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.usage-mini .um-label{font-size:11px;color:#A9B5AC;font-weight:500}
.usage-mini .um-val{font-family:var(--mono);font-size:11px;color:#fff;font-weight:600}
.usage-track{height:5px;background:#0E1612;border-radius:99px;overflow:hidden}
.usage-fill{height:100%;background:linear-gradient(90deg,var(--lime-deep),var(--lime));border-radius:99px;transition:width .5s var(--ease)}
.upgrade-link{display:flex;align-items:center;gap:7px;justify-content:center;width:100%;margin-top:9px;padding:8px;border-radius:var(--r-sm);background:var(--lime);color:var(--sidebar);font-weight:600;font-size:12.5px;transition:transform .15s,box-shadow .15s}
.upgrade-link:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(196,240,0,.3)}

/* ---- Main ---- */
#main{display:flex;flex-direction:column;min-width:0;background:var(--paper);position:relative}
.topbar{height:60px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 24px;background:rgba(251,251,249,.86);backdrop-filter:blur(10px);position:sticky;top:0;z-index:20;flex-shrink:0}
.topbar h1{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;letter-spacing:-.02em}
.topbar .sub{color:var(--slate);font-size:13px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.tb-search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-pill);padding:8px 15px;width:260px;transition:border-color .15s,box-shadow .15s}
.tb-search:focus-within{border-color:var(--lime-deep);box-shadow:0 0 0 3px var(--lime-dim)}
.tb-search input{border:none;outline:none;font-size:13.5px;width:100%;background:none;color:var(--ink)}
.tb-search .ti{color:var(--slate-2);font-size:17px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--lime);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:13px;flex-shrink:0;cursor:pointer}

/* page scroll area */
.page{flex:1;overflow-y:auto;min-height:0}
.page-inner{max-width:1180px;margin:0 auto;padding:24px}

/* ---- Profile banner ---- */
.profile-banner{display:flex;align-items:center;gap:12px;background:var(--mid-bg);border:1px solid #F0D9A0;border-radius:var(--r-md);padding:12px 16px;margin-bottom:20px}
.profile-banner .ti{color:var(--mid);font-size:20px}
.profile-banner .pb-txt{font-size:13.5px;color:#7A5A12}
.profile-banner .pb-txt b{color:#5E4609}
.profile-banner a{margin-left:auto;font-weight:600;font-size:13px;color:var(--lime-ink);background:#fff;border:1px solid #EAD9A8;padding:7px 14px;border-radius:var(--r-sm);white-space:nowrap}

/* ---- Greeting ---- */
.greeting{margin-bottom:20px}
.greeting h2{font-family:'Space Grotesk',sans-serif;font-size:25px;font-weight:700;letter-spacing:-.025em;margin-bottom:3px}
.greeting p{color:var(--slate);font-size:14px}
.greeting .hl{color:var(--lime-ink);font-weight:600}

/* ---- Stat tiles ---- */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:15px 17px}
.stat .s-label{font-size:12px;color:var(--slate);font-weight:500;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.stat .s-label .ti{font-size:14px;color:var(--slate-2)}
.stat .s-val{font-family:'Space Grotesk',sans-serif;font-size:27px;font-weight:700;letter-spacing:-.02em;line-height:1}
.stat .s-val .unit{font-size:14px;color:var(--slate-2);font-weight:500}

/* ---- Source strip ---- */
.source-strip{display:flex;gap:10px;margin-bottom:20px;overflow-x:auto;padding-bottom:2px}
.src-tile{flex:1;min-width:150px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;display:flex;align-items:center;gap:11px}
.src-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;position:relative}
.src-dot.ok{background:var(--hi)}
.src-dot.ok::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1.5px solid var(--hi);opacity:.4;animation:ping 2s ease-out infinite}
.src-dot.slow{background:var(--mid)}
.src-dot.down{background:var(--coral)}
@keyframes ping{0%{transform:scale(1);opacity:.5}100%{transform:scale(2.2);opacity:0}}
.src-tile .st-name{font-weight:600;font-size:13.5px}
.src-tile .st-time{font-family:var(--mono);font-size:11px;color:var(--slate-2);margin-top:1px}

/* ---- Toolbar ---- */
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.pill{font-size:13px;font-weight:500;padding:7px 14px;border-radius:var(--r-pill);background:var(--card);border:1px solid var(--line);color:var(--ink-2);transition:all .15s;white-space:nowrap}
.pill:hover{border-color:var(--slate-2)}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill .ct{font-family:var(--mono);opacity:.6;margin-left:5px;font-size:11px}
.tool-sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.src-pill{display:inline-flex;align-items:center;gap:6px}
.src-pill .sd{width:7px;height:7px;border-radius:50%}

/* ============ FEED LAYOUT (with docked detail) ============ */
.feed-wrap{display:grid;grid-template-columns:1fr;gap:0;transition:grid-template-columns .3s var(--ease)}
.feed-wrap.detail-open{grid-template-columns:1fr 372px;gap:20px}
.feed-list{display:flex;flex-direction:column;gap:12px;min-width:0}

/* ---- Lead card ---- */
.lead-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;transition:transform .18s var(--ease),box-shadow .18s,border-color .18s;cursor:pointer;position:relative}
.lead-card:hover{transform:translateY(-2px);box-shadow:var(--sh-md);border-color:var(--line)}
.lead-card.sel{border-color:var(--lime-deep);box-shadow:0 0 0 1px var(--lime-deep)}
.lc-top{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.src-badge{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.04em;padding:3px 8px;border-radius:5px;white-space:nowrap}
.sb-reddit{background:#FFEDE9;color:#C73A1F}.sb-reed{background:#E7F0FD;color:#2A5FB8}
.sb-wwr{background:#FCF2DD;color:#9A6A0C}.sb-rok{background:#F1E9FC;color:#7344C0}
.state-badge{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;padding:2px 7px;border-radius:4px}
.st-new{background:var(--lime);color:var(--sidebar)}
.st-viewed{background:var(--line-2);color:var(--slate)}
.st-saved{background:var(--mid-bg);color:var(--mid)}
.st-applied{background:var(--hi-bg);color:var(--hi)}
.lc-time{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--slate-2)}

/* the SIGNATURE score gauge */
.score-gauge{display:flex;align-items:center;gap:9px;flex-shrink:0}
.gauge-ring{position:relative;width:42px;height:42px;flex-shrink:0}
.gauge-ring svg{transform:rotate(-90deg)}
.gauge-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:14px}
.lc-title{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.3;margin-bottom:5px;display:flex;gap:10px;align-items:flex-start}
.lc-title .tt{flex:1}
.lc-desc{font-size:13px;color:var(--slate);line-height:1.55;margin-bottom:12px;max-width:68ch;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lc-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:11px}
.budget{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--lime-ink);background:var(--lime-dim);padding:3px 9px;border-radius:var(--r-sm)}
.meta-chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--slate)}
.meta-chip .ti{font-size:14px;color:var(--slate-2)}
.skills-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.skill{font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:var(--r-pill);background:var(--paper-2);color:var(--slate);border:1px solid var(--line-2)}
.skill.match{background:var(--lime-dim);color:var(--lime-ink);border-color:#DDEFA8}
.skill.match .ti{font-size:12px;margin-right:2px}
.lc-actions{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line-2);padding-top:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:600;font-size:13.5px;padding:9px 16px;border-radius:var(--r-sm);transition:all .16s;white-space:nowrap}
.btn-primary{background:var(--lime);color:var(--sidebar)}
/* Color & Behavior lesson (the "BOB" / warm-CTA principle): at the single highest-intent
   conversion moment — the upgrade prompt — use a warm action color (amber→coral) rather than
   the cool brand lime, since warm hues prompt action. Used sparingly so it stays meaningful. */
.btn-warm{background:linear-gradient(135deg,#FF8A3D,#FF6A3D);color:#fff}
.btn-warm:hover{background:linear-gradient(135deg,#FF7A2D,#FF5A2D);box-shadow:0 6px 18px rgba(255,106,61,.34);transform:translateY(-1px)}
.btn-warm:active{transform:scale(.96)}
.btn-primary:hover{background:#d2ff1f;box-shadow:0 4px 14px rgba(196,240,0,.32)}
.btn-primary:active{transform:scale(.96)}
.btn-ghost{background:var(--paper-2);color:var(--ink-2)}
.btn-ghost:hover{background:var(--line)}
.btn-icon{width:38px;height:38px;padding:0;border-radius:var(--r-sm);background:var(--paper-2);color:var(--slate)}
.btn-icon:hover{background:var(--line);color:var(--ink)}
.btn-icon.on{background:var(--mid-bg);color:var(--mid)}
.btn-icon .ti{font-size:18px}
.applied-tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--hi)}

/* sub-score peek (inline, always visible on hover/expand) */
.subscore-peek{display:flex;gap:14px;margin-bottom:13px;padding:11px 13px;background:var(--paper-2);border-radius:var(--r-md)}
.ssp-item{flex:1}
.ssp-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.ssp-label{font-size:10.5px;color:var(--slate);font-weight:500;text-transform:uppercase;letter-spacing:.03em}
.ssp-val{font-family:var(--mono);font-size:11.5px;font-weight:700}
.ssp-bar{height:4px;background:var(--line);border-radius:99px;overflow:hidden}
.ssp-fill{height:100%;border-radius:99px}

/* ============ DETAIL PANEL ============ */
.detail-panel{position:sticky;top:0;align-self:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:none;flex-direction:column;max-height:calc(100vh - 60px - 48px)}
.feed-wrap.detail-open .detail-panel{display:flex;animation:slideIn .3s var(--ease)}
@keyframes slideIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.dp-head{padding:16px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:flex-start;gap:10px}
.dp-close{margin-left:auto;width:30px;height:30px;border-radius:var(--r-sm);background:var(--paper-2);color:var(--slate);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dp-close:hover{background:var(--line)}
.dp-body{overflow-y:auto;padding:18px}
.dp-title{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.25;margin-bottom:8px}
.dp-sub{font-size:12.5px;color:var(--slate);margin-bottom:16px;display:flex;align-items:center;gap:7px}
.dp-section-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate-2);margin:18px 0 10px}
.dp-why{background:var(--paper-2);border-radius:var(--r-md);padding:14px;margin-bottom:4px}
.dp-why-top{display:flex;align-items:center;gap:11px;margin-bottom:13px}
.dp-why-expl{font-size:13px;color:var(--ink-2);line-height:1.5;margin-bottom:14px}
.subscore-full{display:flex;flex-direction:column;gap:13px}
.ssf-row{}
.ssf-head{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.ssf-icon{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ssf-icon .ti{font-size:14px}
.ssf-label{font-size:13px;font-weight:600}
.ssf-weight{font-family:var(--mono);font-size:10px;color:var(--slate-2);background:var(--line-2);padding:1px 6px;border-radius:4px;margin-left:4px}
.ssf-score{margin-left:auto;font-family:var(--mono);font-size:13px;font-weight:700}
.ssf-bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:4px}
.ssf-fill{height:100%;border-radius:99px}
.ssf-detail{font-size:11.5px;color:var(--slate);line-height:1.45}
.dp-desc{font-size:13px;color:var(--ink-2);line-height:var(--lh-body);max-width:68ch}
.dp-actions{padding:16px 18px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:9px}

/* skill detail */
.skill-detail{display:flex;flex-wrap:wrap;gap:6px}
.skill-yes{font-size:11.5px;font-weight:500;padding:4px 10px;border-radius:var(--r-pill);background:var(--hi-bg);color:var(--hi);display:inline-flex;align-items:center;gap:4px}
.skill-no{font-size:11.5px;font-weight:500;padding:4px 10px;border-radius:var(--r-pill);background:var(--lo-bg);color:var(--slate)}

/* ===== TOP-MATCH HALO (Ecom: status badge / halo effect crowns the best item) ===== */
.lead-card.top-match{border-color:#E9D8A0;box-shadow:0 0 0 1px #EAD98F,0 6px 20px rgba(216,146,10,.10)}
.crown{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;
  background:linear-gradient(90deg,#FFE08A,#F6C453);color:#5E4609;padding:3px 9px;border-radius:5px}
.crown .ti{font-size:12px}
/* ===== SOCIAL PROOF (Ecom: "N sold this week" trust anchor + specific numbers) ===== */
.proof{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:#C2410C}
.proof .ti{font-size:14px}
.proof.cool{color:var(--slate)}
/* ===== INLINE SCORE REASON (Top5p2: reduce interaction cost — show the why w/o a click) ===== */
.why-inline{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);background:var(--paper-2);
  border-radius:var(--r-sm);padding:7px 11px;margin-bottom:12px;line-height:1.4}
.why-inline .ti{font-size:15px;color:var(--lime-deep);flex-shrink:0}
.why-inline b{color:var(--ink);font-weight:600}
/* ===== SOURCE AVATAR (Top5p2: visual cue — colour + letter identity) ===== */
.src-ava{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:700;font-size:11px;color:#fff;flex-shrink:0}
/* ===== SEARCH SUGGESTIONS (Top5p3: smarter search — recent + popular on focus) ===== */
.search-wrap{position:relative}
.suggest{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-md);box-shadow:var(--sh-md);padding:8px;z-index:60;display:none}
.suggest.show{display:block;animation:slideIn .18s var(--ease)}
.suggest-label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate-2);padding:8px 10px 5px}
.suggest-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);font-size:13.5px;cursor:pointer;color:var(--ink-2)}
.suggest-item:hover{background:var(--paper-2)}
.suggest-item .ti{font-size:16px;color:var(--slate-2)}
.suggest-item .tag{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--slate-2)}
/* ===== SEGMENT BANNER (Top5p3: personalize by user behaviour) ===== */
.seg-banner{display:flex;align-items:center;gap:13px;border-radius:var(--r-md);padding:13px 16px;margin-bottom:18px}
.seg-new{background:var(--lime-dim);border:1px solid #DDEFA8}
.seg-power{background:#EEF6FF;border:1px solid #CFE3FA}
.seg-banner .ti{font-size:22px;flex-shrink:0}
.seg-new .ti{color:var(--lime-deep)}.seg-power .ti{color:#2A5FB8}
.seg-banner .sb-txt{font-size:13.5px;color:var(--ink-2);line-height:1.45}
.seg-banner .sb-txt b{color:var(--ink)}
/* ===== PIPELINE STAGE TIMELINE (Top5p3: visual timeline beats a data dump) ===== */
.stage-track{display:flex;align-items:center;gap:4px;margin-top:10px}
.stage-dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.stage-dot.done{background:var(--hi)}
.stage-dot.now{background:var(--mid);box-shadow:0 0 0 3px var(--mid-bg)}
.stage-line{flex:1;height:2px;background:var(--line)}
.stage-line.done{background:var(--hi)}
.stage-lbl{font-size:10.5px;color:var(--slate-2);font-weight:600;margin-left:6px}
/* ===== STAT DELTA (Top5p1: make the value prominent; show momentum) ===== */
.s-delta{font-size:11.5px;font-weight:600;margin-top:5px;display:inline-flex;align-items:center;gap:3px}
.s-delta.up{color:var(--hi)}.s-delta.down{color:var(--coral)}
.s-delta .ti{font-size:13px}
/* ===== BILLING — billing toggle + selection cards (Ecom: side-by-side, default best value) ===== */
.bill-toggle{display:inline-flex;background:var(--paper-2);border-radius:var(--r-pill);padding:4px;gap:2px;margin-bottom:8px}
.bill-toggle button{padding:7px 16px;border-radius:var(--r-pill);font-size:13px;font-weight:600;color:var(--slate);transition:all .15s}
.bill-toggle button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh-sm)}
.bill-toggle .save{font-family:var(--mono);font-size:10px;color:var(--lime-deep);margin-left:5px}
.reassure{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line-2)}
.reassure span{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--slate)}
.reassure .ti{font-size:14px;color:var(--lime-deep)}
.price-card.pro .reassure{border-top-color:rgba(255,255,255,.12)}
.price-card.pro .reassure span{color:#A9B5AC}
.price-card.pro .reassure .ti{color:var(--lime)}

/* ============ EMPTY / LOCK ============ */
.empty{text-align:center;padding:60px 20px}
.empty-icon{width:64px;height:64px;border-radius:var(--r-lg);background:var(--lime-dim);color:var(--lime-deep);display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.empty-icon .ti{font-size:30px}
.empty h3{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;margin-bottom:7px}
.empty p{color:var(--slate);font-size:14px;max-width:380px;margin:0 auto 18px;line-height:1.55}
.lock-card{background:linear-gradient(135deg,var(--sidebar),var(--sidebar-2));border-radius:var(--r-lg);padding:22px;display:flex;align-items:center;gap:18px;margin-top:12px;color:#fff}
.lock-card .lk-icon{width:48px;height:48px;border-radius:var(--r-md);background:rgba(196,240,0,.15);color:var(--lime);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lock-card .lk-icon .ti{font-size:24px}
.lock-card h4{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;margin-bottom:3px}
.lock-card p{font-size:13px;color:#A9B5AC;line-height:1.45}
.lock-card .btn{margin-left:auto;flex-shrink:0}

/* ============ PIPELINE (kanban) ============ */
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;height:100%}
.kan-col{background:var(--paper-2);border-radius:var(--r-lg);display:flex;flex-direction:column;min-height:0}
.kan-head{padding:14px 16px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line)}
.kan-dot{width:9px;height:9px;border-radius:50%}
.kan-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px}
.kan-count{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--slate);background:var(--card);padding:2px 9px;border-radius:var(--r-pill)}
.kan-body{padding:12px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1;min-height:120px}
.kan-body.dragover{background:var(--lime-dim);outline:2px dashed var(--lime-deep);outline-offset:-6px;border-radius:var(--r-md)}
.kan-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:13px;cursor:grab;transition:box-shadow .15s,transform .15s}
.kan-card:hover{box-shadow:var(--sh-sm)}
.kan-card.dragging{opacity:.4;cursor:grabbing}
.kan-card .kc-top{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.kan-card .kc-title{font-weight:600;font-size:13.5px;line-height:1.35;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kan-card .kc-foot{display:flex;align-items:center;gap:7px}
.kan-empty{text-align:center;color:var(--slate-2);font-size:13px;padding:30px 10px}

/* ============ GENERIC PAGE CARDS (saved/settings/billing) ============ */
.section-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;margin-bottom:16px}
.saved-row{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.saved-row:last-child{border-bottom:none}
.saved-row .sr-main{flex:1;min-width:0}
.saved-row .sr-title{font-weight:600;font-size:14px;margin-bottom:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tab{padding:11px 16px;font-weight:600;font-size:14px;color:var(--slate);position:relative}
.tab.on{color:var(--ink)}
.tab.on::after{content:"";position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--lime-deep)}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.input{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:var(--r-sm);font-family:inherit;font-size:14px;background:var(--card);outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--lime-deep);box-shadow:0 0 0 3px var(--lime-dim)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.skill-grid{display:flex;flex-wrap:wrap;gap:8px}
.skill-pick{font-size:13px;font-weight:500;padding:7px 13px;border-radius:var(--r-pill);background:var(--paper-2);border:1px solid var(--line);transition:all .14s}
.skill-pick.on{background:var(--lime-dim);border-color:var(--lime-deep);color:var(--lime-ink)}

/* pricing */
.price-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.price-card{border:1.5px solid var(--line);border-radius:var(--r-lg);padding:24px;position:relative}
.price-card.pro{background:var(--sidebar);color:#fff;border-color:var(--sidebar)}
.price-card.pro .pc-feat{color:#C8D0CA}
.pc-name{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--slate);margin-bottom:8px}
.price-card.pro .pc-name{color:var(--lime)}
.pc-price{font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
.pc-price .per{font-size:14px;color:var(--slate-2);font-weight:500}
.pc-feats{list-style:none;margin:18px 0;display:flex;flex-direction:column;gap:10px}
.pc-feat{display:flex;align-items:center;gap:9px;font-size:13.5px}
.pc-feat .ti{color:var(--lime-deep);font-size:17px}
.price-card.pro .pc-feat .ti{color:var(--lime)}
.reco-pill{position:absolute;top:-11px;right:20px;background:var(--lime);color:var(--sidebar);font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;padding:4px 11px;border-radius:var(--r-pill)}

/* ============ MOBILE ============ */
#mobile-top,#mobile-tabs{display:none}
.overlay{display:none}
@media(max-width:860px){
  #app{grid-template-columns:1fr}
  #rail{position:fixed;left:0;top:0;bottom:0;width:236px;transform:translateX(-100%);transition:transform .28s var(--ease);z-index:60}
  #rail.open{transform:none}
  .overlay.show{display:block;position:fixed;inset:0;background:rgba(21,32,26,.4);z-index:50}
  #mobile-top{display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:20}
  .topbar{display:none}
  #mobile-tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:40;padding:6px 0 max(6px,env(safe-area-inset-bottom))}
  .mtab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--slate-2);font-size:10.5px;font-weight:600;position:relative}
  .mtab .ti{font-size:21px}
  .mtab.on{color:var(--ink)}
  .mtab.on::before{content:"";position:absolute;top:0;width:22px;height:2px;background:var(--lime-deep);border-radius:99px}
  .page{padding-bottom:70px}
  .stat-row{grid-template-columns:1fr 1fr}
  .feed-wrap.detail-open{grid-template-columns:1fr}
  .detail-panel{position:fixed;inset:0;z-index:70;border-radius:0;max-height:100vh}
  .kanban{grid-template-columns:1fr;height:auto}
  .kan-col{min-height:200px}
  .price-grid,.field-row{grid-template-columns:1fr}
  .page-inner{padding:16px}
}
</style>

<div id="toast" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:var(--r-md);font-size:13.5px;font-weight:500;z-index:200;transition:transform .3s var(--ease);box-shadow:var(--sh-lg);white-space:nowrap"></div>

<script>
/* ============ DATA ============ */
const PROFILE = { name:"Mamadou", rate:55, skills:["React","TypeScript","Figma","Next.js","Node.js","UI Design"] };

const SUB = { skill:{label:"Skill match",w:40,icon:"ti-target-arrow"}, rate:{label:"Rate match",w:30,icon:"ti-currency-pound"}, recency:{label:"Recency",w:20,icon:"ti-clock"}, detail:{label:"Detail",w:10,icon:"ti-file-text"} };

let LEADS = [
  { id:1, src:"reddit", title:"Senior React Developer — Fintech dashboard", time:"2h ago", state:"new", applicants:11, posted:"2h",
    desc:"Building a trading dashboard with real-time data viz. Need someone strong in React + TypeScript who can own the frontend end-to-end for a 3-month engagement.",
    budget:"£400–500/day", loc:"London (hybrid)", type:"3-month contract",
    skills:[["React",1],["TypeScript",1],["D3.js",0],["WebSocket",0]],
    sub:{skill:9,rate:8,recency:9,detail:7}, why:"Strong skill match (9/10) and your rate fits comfortably — only loses points on missing D3 experience.",
    skillDetail:{have:["React","TypeScript"],miss:["D3.js","WebSocket"]} },
  { id:2, src:"reed", title:"Frontend Engineer — Design system build", time:"4h ago", state:"new", applicants:6, posted:"4h",
    desc:"Established agency needs a frontend engineer to build a component library in React + Storybook. Outside IR35, remote-first, long-term potential.",
    budget:"£450/day", loc:"Remote (UK)", type:"6-month, outside IR35",
    skills:[["React",1],["TypeScript",1],["Storybook",0],["CSS",1]],
    sub:{skill:8,rate:9,recency:8,detail:9}, why:"Excellent rate match and a detailed, well-scoped listing. Outside IR35 is a plus for your take-home.",
    skillDetail:{have:["React","TypeScript","UI Design"],miss:["Storybook"]} },
  { id:3, src:"wwr", title:"Product Designer — SaaS onboarding flows", time:"6h ago", state:"new", applicants:3, posted:"6h",
    desc:"Healthtech startup redesigning their onboarding. Figma-heavy, working directly with founders. Async-friendly, GMT±3.",
    budget:"£60–75k", loc:"Remote", type:"Full-time contract",
    skills:[["Figma",1],["UI Design",1],["UX Research",0],["Prototyping",0]],
    sub:{skill:8,rate:6,recency:7,detail:8}, why:"Good design-skill fit, but the salary works out below your day rate over the year.",
    skillDetail:{have:["Figma","UI Design"],miss:["UX Research","Prototyping"]} },
  { id:4, src:"rok", title:"Full-Stack Developer — Marketplace MVP", time:"9h ago", state:"viewed", applicants:8, posted:"9h",
    desc:"Early-stage founder building a two-sided marketplace. Next.js + Node + Postgres. Equity + cash mix possible for the right person.",
    budget:"£70–90k", loc:"Remote", type:"Contract-to-hire",
    skills:[["Next.js",1],["Node.js",1],["PostgreSQL",0],["React",1]],
    sub:{skill:9,rate:7,recency:6,detail:6}, why:"Very strong stack match. Listing is a little thin on scope detail, and posted earlier today.",
    skillDetail:{have:["Next.js","Node.js","React"],miss:["PostgreSQL"]} },
  { id:5, src:"reddit", title:"WordPress dev for small business site", time:"1d ago", state:"viewed", applicants:24, posted:"1d",
    desc:"Local cafe needs a simple 5-page WordPress site with online booking. One-off project, quick turnaround wanted.",
    budget:"£800 fixed", loc:"Remote", type:"One-off project",
    skills:[["WordPress",0],["PHP",0],["CSS",1]],
    sub:{skill:3,rate:4,recency:5,detail:6}, why:"Outside your core stack and the fixed budget is well below your usual rate — likely not worth your time.",
    skillDetail:{have:["CSS"],miss:["WordPress","PHP"]} },
];

let PIPELINE = {
  interested:[ {id:101,src:"reed",title:"React Native developer — fitness app",budget:"£420/day",time:"1d ago"} ],
  applied:[ {id:102,src:"wwr",title:"Lead Frontend — climate-tech platform",budget:"£500/day",time:"3d ago"},
            {id:103,src:"reddit",title:"Vue.js developer — internal tooling",budget:"£380/day",time:"4d ago"} ],
  won:[ {id:104,src:"reed",title:"Design system consultant — bank",budget:"£550/day",time:"2w ago"} ],
};

let SAVED = [];
let state = { page:"feed", scoreFilter:"all", srcFilter:"all", selected:null, search:"", apps:2, isPro:false, loading:false };

function skeletonCards(n){
  let s="";
  for(let i=0;i<n;i++){
    s+=`<div class="skel-card">
      <div style="display:flex;gap:8px;margin-bottom:12px"><div class="skel" style="width:64px;height:18px"></div><div class="skel" style="width:48px;height:18px"></div><div class="skel" style="width:40px;height:18px;margin-left:auto"></div></div>
      <div style="display:flex;gap:10px"><div class="skel" style="width:42px;height:42px;border-radius:50%;flex-shrink:0"></div>
        <div style="flex:1"><div class="skel skel-line" style="width:70%"></div><div class="skel skel-line" style="width:95%"></div><div class="skel skel-line" style="width:88%;margin-bottom:0"></div></div></div>
    </div>`;
  }
  return s;
}

/* ============ HELPERS ============ */
const SRC = { reddit:{name:"Reddit",cls:"sb-reddit",dot:"var(--reddit)",ava:"#FF5A3C",ini:"R"}, reed:{name:"Reed",cls:"sb-reed",dot:"var(--reed)",ava:"#3B7BE0",ini:"R"},
  wwr:{name:"WWR",cls:"sb-wwr",dot:"var(--wwr)",ava:"#E8A020",ini:"W"}, rok:{name:"Remote OK",cls:"sb-rok",dot:"var(--rok)",ava:"#9B6BE0",ini:"O"} };
const scoreOf = l => Math.round((l.sub.skill*.4 + l.sub.rate*.3 + l.sub.recency*.2 + l.sub.detail*.1)*10)/10;
const scoreColor = s => s>=8?{c:"var(--hi)",bg:"var(--hi-bg)"}:s>=5?{c:"var(--mid)",bg:"var(--mid-bg)"}:{c:"var(--lo)",bg:"var(--lo-bg)"};
const barColor = v => v>=8?"var(--hi)":v>=5?"var(--mid)":"var(--coral)";
const esc = s => s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Top5p3: personalize by behaviour. Segment derived from activity signals.
   (In production this comes from the backend — see lib/segment.ts.) */
const ACTIVITY = { applicationsTotal:2, daysActive:1, leadsViewed:3 };
function userSegment(){
  if(ACTIVITY.applicationsTotal>=10 || ACTIVITY.daysActive>=14) return "power";
  if(ACTIVITY.applicationsTotal>=1 || ACTIVITY.daysActive>=2) return "returning";
  return "new";
}
/* Top5p3: smarter search — recent + popular suggestions on focus. */
const RECENT_SEARCHES = ["React contract","outside IR35","Figma remote"];
const POPULAR_SEARCHES = [["Next.js","312 leads"],["UI design","204 leads"],["£500+/day","98 leads"]];

/* Top5p1: the top sub-score reason, one line, no click needed. */
function topReason(l){
  const entries=Object.entries(l.sub).sort((a,b)=>b[1]-a[1]);
  const [topK,topV]=entries[0]; const [loK,loV]=entries[entries.length-1];
  const labels={skill:"skill match",rate:"rate match",recency:"freshness",detail:"detail"};
  if(loV<=4) return `<b>Strong ${labels[topK]}</b> (${topV}/10), weaker on ${labels[loK]}`;
  return `<b>Strong ${labels[topK]}</b> — scores ${topV}/10 on fit`;
}

function gaugeSVG(score){
  const pct=score/10, r=18, circ=2*Math.PI*r, off=circ*(1-pct), col=scoreColor(score).c;
  return `<div class="gauge-ring"><svg width="42" height="42" viewBox="0 0 42 42">
    <circle cx="21" cy="21" r="${r}" fill="none" stroke="var(--line)" stroke-width="4"/>
    <circle cx="21" cy="21" r="${r}" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round"
      stroke-dasharray="${circ}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .6s var(--ease)"/>
  </svg><span class="gauge-num" style="color:${col}">${score}</span></div>`;
}

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.style.transform="translateX(-50%) translateY(0)"; clearTimeout(t._t); t._t=setTimeout(()=>t.style.transform="translateX(-50%) translateY(120px)",2400); }

/* ============ NAV ============ */
function nav(page){
  state.page=page; state.selected=null;
  document.querySelectorAll('.nav-item[data-page]').forEach(n=>n.classList.toggle('active',n.dataset.page===page));
  document.querySelectorAll('.mtab[data-page]').forEach(n=>n.classList.toggle('on',n.dataset.page===page));
  document.getElementById('tb-title').textContent={feed:"Feed",saved:"Saved",pipeline:"Pipeline",settings:"Settings",billing:"Plan"}[page];
  closeRail();
  render();
}
function openRail(){document.getElementById('rail').classList.add('open');document.getElementById('overlay').classList.add('show');}
function closeRail(){document.getElementById('rail').classList.remove('open');document.getElementById('overlay').classList.remove('show');}

/* ============ RENDER ROUTER ============ */
function render(){
  const el=document.getElementById('page-inner');
  if(state.page==="feed") el.innerHTML=renderFeed();
  else if(state.page==="saved") el.innerHTML=renderSaved();
  else if(state.page==="pipeline"){el.innerHTML=renderPipeline();wireDnD();}
  else if(state.page==="settings") el.innerHTML=renderSettings();
  else if(state.page==="billing") el.innerHTML=renderBilling();
  updateUsage();
}
function updateUsage(){
  const cap=state.isPro?"Unlimited":"/ 5";
  document.getElementById('usage-text').textContent=state.isPro?"Unlimited":`${state.apps} / 5`;
  document.getElementById('usage-fill').style.width=state.isPro?"100%":`${state.apps/5*100}%`;
}

/* ============ FEED ============ */
function visibleLeads(){
  let ls=LEADS.slice();
  if(state.search){const q=state.search.toLowerCase();ls=ls.filter(l=>l.title.toLowerCase().includes(q)||l.desc.toLowerCase().includes(q));}
  if(state.srcFilter!=="all") ls=ls.filter(l=>l.src===state.srcFilter);
  if(state.scoreFilter==="8") ls=ls.filter(l=>scoreOf(l)>=8);
  else if(state.scoreFilter==="7") ls=ls.filter(l=>scoreOf(l)>=7);
  else if(state.scoreFilter==="new") ls=ls.filter(l=>l.state==="new");
  else if(state.scoreFilter==="saved") ls=ls.filter(l=>l.state==="saved"||SAVED.includes(l.id));
  return ls.sort((a,b)=>scoreOf(b)-scoreOf(a));
}
function renderFeed(){
  const ls=visibleLeads();
  const top=scoreOf(LEADS.reduce((a,b)=>scoreOf(a)>scoreOf(b)?a:b));
  const topId=LEADS.reduce((a,b)=>scoreOf(a)>scoreOf(b)?a:b).id;
  const hi=LEADS.filter(l=>scoreOf(l)>=7).length, sv=SAVED.length;
  const newCount=LEADS.filter(l=>l.state==="new").length;
  const seg=userSegment();

  const counts={all:LEADS.length, "8":LEADS.filter(l=>scoreOf(l)>=8).length, "7":LEADS.filter(l=>scoreOf(l)>=7).length,
    new:newCount, saved:SAVED.length};

  let cards = ls.length ? ls.map((l,i)=>leadCard(l, l.id===topId && state.scoreFilter==="all" && state.srcFilter==="all" && !state.search)).join("") : emptyFilters();

  // Top5p3: greeting copy adapts to the user's segment.
  const greetMap={
    new:`Welcome, ${PROFILE.name} 👋`,
    returning:`Good to see you, ${PROFILE.name} 👋`,
    power:`Welcome back, ${PROFILE.name} 👋`
  };
  const subMap={
    new:`Your profile is matched against <b>1,247 leads</b> scanned this week. Here are your first picks.`,
    returning:newCount?`<span class="hl">${newCount} new leads</span> scored since your last visit.`:"You're all caught up — here's your ranked feed.",
    power:`<span class="hl">${newCount} new</span> today. You've applied to ${ACTIVITY.applicationsTotal} this month — keep the streak going.`
  };

  return `
  ${(!PROFILE.skills.length)?profileBanner():segBanner(seg)}
  <div class="greeting">
    <h2>${greetMap[seg]}</h2>
    <p>${subMap[seg]}</p>
  </div>

  <div class="stat-row">
    <div class="stat"><div class="s-label"><i class="ti ti-radar-2"></i> Scanned this week</div><div class="s-val">1,247</div><span class="s-delta up"><i class="ti ti-trending-up"></i> 12% vs last week</span></div>
    <div class="stat"><div class="s-label"><i class="ti ti-flame"></i> Matched 7+</div><div class="s-val">${hi}</div><span class="s-delta up"><i class="ti ti-arrow-up-right"></i> 3 new today</span></div>
    <div class="stat"><div class="s-label"><i class="ti ti-award"></i> Top score</div><div class="s-val">${top}<span class="unit">/10</span></div><span class="s-delta" style="color:var(--slate-2)">your best match</span></div>
    <div class="stat"><div class="s-label"><i class="ti ti-bookmark"></i> Saved</div><div class="s-val">${sv}</div><span class="s-delta" style="color:var(--slate-2)">${sv?'ready to revisit':'none yet'}</span></div>
  </div>

  <div class="source-strip">
    ${srcTile("reddit","ok","8m ago")}
    ${srcTile("reed","ok","2h ago")}
    ${srcTile("wwr","slow","14h ago")}
    ${srcTile("rok","ok","3h ago")}
  </div>

  <div class="toolbar">
    ${scorePill("all","All",counts.all)}
    ${scorePill("8","Score 8+",counts["8"])}
    ${scorePill("7","Score 7+",counts["7"])}
    ${scorePill("new","New",counts.new)}
    ${scorePill("saved","Saved",counts.saved)}
    <div class="tool-sep"></div>
    ${srcFilterPill("all","All sources",null)}
    ${srcFilterPill("reddit","Reddit","var(--reddit)")}
    ${srcFilterPill("reed","Reed","var(--reed)")}
    ${srcFilterPill("wwr","WWR","var(--wwr)")}
    ${srcFilterPill("rok","Remote OK","var(--rok)")}
  </div>

  <div class="feed-wrap ${state.selected?'detail-open':''}">
    <div class="feed-list">${cards}</div>
    ${state.selected?detailPanel(LEADS.find(l=>l.id===state.selected)):'<div class="detail-panel"></div>'}
  </div>`;
}

/* Top5p2/Top5p3: segment-aware banner — different guidance per user type. */
function segBanner(seg){
  if(seg==="new") return `<div class="seg-banner seg-new"><i class="ti ti-rocket"></i>
    <div class="sb-txt"><b>You're set up.</b> We've scored every open lead against your skills and rate — your strongest matches are crowned below.</div></div>`;
  if(seg==="power") return `<div class="seg-banner seg-power"><i class="ti ti-bolt"></i>
    <div class="sb-txt"><b>You're on a roll.</b> Power users who apply within 2 hours hear back 3× more often — your fastest matches are up top.</div></div>`;
  return "";
}

function profileBanner(){return `<div class="profile-banner"><i class="ti ti-alert-triangle"></i>
  <div class="pb-txt"><b>Finish your profile</b> — add your skills and rate so we can score leads for you.</div>
  <a onclick="nav('settings')">Complete profile</a></div>`;}

function srcTile(src,health,time){const s=SRC[src];const lab={ok:"",slow:"",down:"awaiting first scan"}[health];
  return `<div class="src-tile"><span class="src-dot ${health}"></span><div><div class="st-name">${s.name}</div><div class="st-time">${health==='down'?lab:'Last scan: '+time}</div></div></div>`;}

function scorePill(key,label,ct){return `<button class="pill ${state.scoreFilter===key?'on':''}" onclick="setScoreFilter('${key}')">${label}${ct!=null?`<span class="ct">${ct}</span>`:''}</button>`;}
function srcFilterPill(key,label,dot){return `<button class="pill src-pill ${state.srcFilter===key?'on':''}" onclick="setSrcFilter('${key}')">${dot?`<span class="sd" style="background:${dot}"></span>`:''}${label}</button>`;}
function setScoreFilter(k){state.scoreFilter=k;feedReload();}
function setSrcFilter(k){state.srcFilter=k;feedReload();}
function feedReload(){
  // Info lesson: give visible feedback that results are updating.
  const list=document.querySelector('.feed-list');
  if(list){list.innerHTML=skeletonCards(3);}
  clearTimeout(window._fr);
  window._fr=setTimeout(()=>render(),360);
}
function searchLeads(v){state.search=v;if(state.page==="feed")render();}
/* Top5p3: smarter search — show recent + popular when the field gains focus. */
function showSuggest(){
  const box=document.getElementById('suggestBox'); if(!box)return;
  box.innerHTML=`
    <div class="suggest-label">Recent</div>
    ${RECENT_SEARCHES.map(q=>`<div class="suggest-item" onmousedown="applySuggest('${q}')"><i class="ti ti-history"></i>${q}</div>`).join("")}
    <div class="suggest-label">Popular this week</div>
    ${POPULAR_SEARCHES.map(([q,n])=>`<div class="suggest-item" onmousedown="applySuggest('${q}')"><i class="ti ti-trending-up"></i>${q}<span class="tag">${n}</span></div>`).join("")}`;

function hideSuggest(){const box=document.getElementById('suggestBox');if(box)setTimeout(()=>box.classList.remove('show'),120);}
function applySuggest(q){const inp=document.getElementById('searchInput');if(inp)inp.value=q;state.search=q;nav('feed');}

function leadCard(l, isTop){
  const sc=scoreOf(l), s=SRC[l.src];
  const stateBadge={new:["NEW","st-new"],viewed:["VIEWED","st-viewed"],saved:["SAVED","st-saved"],applied:["APPLIED","st-applied"]}[l.state];
  const saved=SAVED.includes(l.id);
  const skills=l.skills.slice(0,3).map(([n,m])=>`<span class="skill ${m?'match':''}">${m?'<i class="ti ti-check"></i>':''}${n}</span>`).join("")
    + (l.skills.length>3?`<span class="skill">+${l.skills.length-3}</span>`:"");
  const applied=l.state==="applied";
  // Ecom: social proof — hot (many applicants, but reframed as urgency) vs calm.
  const hot=l.applicants>=10;
  const proof = hot
    ? `<span class="proof"><i class="ti ti-flame"></i>${l.applicants} applied · apply early</span>`
    : `<span class="proof cool"><i class="ti ti-users"></i>${l.applicants} applied so far</span>`;
  return `<article class="lead-card ${state.selected===l.id?'sel':''} ${isTop?'top-match':''}" onclick="selectLead(${l.id})">
    <div class="lc-top">
      <span class="src-ava" style="background:${s.ava}">${s.ini}</span>
      <span class="src-badge ${s.cls}">${s.name.toUpperCase()}</span>
      ${isTop?`<span class="crown"><i class="ti ti-crown"></i>TOP MATCH</span>`:`<span class="state-badge ${stateBadge[1]}">${stateBadge[0]}</span>`}
      <span class="lc-time">${l.time}</span>
    </div>
    <div class="lc-title">
      ${gaugeSVG(sc)}
      <span class="tt">${esc(l.title)}</span>
    </div>
    <div class="why-inline"><i class="ti ti-sparkles"></i><span>${topReason(l)}</span></div>
    <p class="lc-desc">${esc(l.desc)}</p>
    <div class="lc-meta">
      <span class="budget">${l.budget}</span>
      <span class="meta-chip"><i class="ti ti-map-pin"></i>${l.loc}</span>
      ${proof}
    </div>
    <div class="skills-row">${skills}</div>
    <div class="lc-actions" onclick="event.stopPropagation()">
      <button class="btn-icon tip ${saved?'on':''}" data-tip="${saved?'Remove from saved':'Save for later'}" aria-label="${saved?'Remove from saved':'Save for later'}" onclick="toggleSave(${l.id})"><i class="ti ti-bookmark${saved?'-filled':''}"></i></button>
      ${applied
        ? `<span class="applied-tag"><i class="ti ti-circle-check-filled"></i> In your pipeline</span>`
        : `<button class="btn btn-primary" onclick="apply(${l.id})"><i class="ti ti-send"></i> Apply</button>
           <button class="btn btn-ghost" onclick="selectLead(${l.id})">Full breakdown</button>`}
    </div>
  </article>`;
}

/* ---- sub-score bars (shared) ---- */
function subBars(l,full){
  return Object.keys(SUB).map(k=>{
    const v=l.sub[k], m=SUB[k];
    if(!full){return `<div class="ssp-item"><div class="ssp-head"><span class="ssp-label">${m.label.split(' ')[0]}</span><span class="ssp-val" style="color:${barColor(v)}">${v}</span></div><div class="ssp-bar"><div class="ssp-fill" style="width:${v*10}%;background:${barColor(v)}"></div></div></div>`;}
    const detail={skill:`${l.skillDetail.have.length} of ${l.skillDetail.have.length+l.skillDetail.miss.length} required skills match your profile`,
      rate:`Budget ${v>=7?'fits':v>=5?'is near':'is below'} your £${PROFILE.rate}/hr target`,
      recency:`Posted ${l.time}`, detail:`Listing is ${v>=8?'thorough':v>=5?'adequate':'thin'} on scope`}[k];
    return `<div class="ssf-row"><div class="ssf-head">
        <span class="ssf-icon" style="background:${scoreColor(v).bg}"><i class="ti ${m.icon}" style="color:${barColor(v)}"></i></span>
        <span class="ssf-label">${m.label}<span class="ssf-weight">${m.w}%</span></span>
        <span class="ssf-score" style="color:${barColor(v)}">${v}/10</span></div>
      <div class="ssf-bar"><div class="ssf-fill" style="width:${v*10}%;background:${barColor(v)}"></div></div>
      <div class="ssf-detail">${detail}</div></div>`;
  }).join("");
}

/* ---- detail panel ---- */
function selectLead(id){const l=LEADS.find(x=>x.id===id);if(l.state==="new")l.state="viewed";state.selected=id;render();}
function closeDetail(){state.selected=null;render();}

    ? `<a class="btn btn-ghost" style="width:100%" href="#" onclick="toast('Opening original listing…');return false"><i class="ti ti-external-link"></i> Open original listing</a>`

      <div class="dp-title">${esc(l.title)}</div>

      <div class="lc-meta"><span class="budget">${l.budget}</span></div>

      <div class="dp-section-label">Why this score</div>
      <div class="dp-why">
        <div class="dp-why-expl">${l.why}</div>
        <div class="subscore-full">${subBars(l,true)}</div>

      <div class="dp-section-label">Skill match</div>
      <div class="skill-detail">
        ${l.skillDetail.have.map(s=>`<span class="skill-yes"><i class="ti ti-check"></i>${s}</span>`).join("")}
        ${l.skillDetail.miss.map(s=>`<span class="skill-no">${s}</span>`).join("")}
      </div>

      <div class="dp-section-label">Description</div>

        ? `<span class="applied-tag" style="justify-content:center"><i class="ti ti-circle-check-filled"></i> Tracking in your pipeline</span>`
        : `<button class="btn btn-primary" style="width:100%" onclick="apply(${l.id})"><i class="ti ti-send"></i> Apply &amp; track</button>
           <div class="reassure" style="border-top:none;padding-top:0;margin-top:2px;justify-content:center">

    </div>

/* ============ ACTIONS (workflow) ============ */
function toggleSave(id){
  const i=SAVED.indexOf(id);
  if(i>=0){SAVED.splice(i,1);toast("Removed from saved");}
  else{SAVED.push(id);toast("Saved for later");}
  render();
}
function apply(id){
  if(!state.isPro && state.apps>=5){ showLimit(); return; }
  const l=LEADS.find(x=>x.id===id); l.state="applied"; state.apps++;
  // add to pipeline interested
  if(!PIPELINE.applied.find(p=>p.id===id)&&!PIPELINE.interested.find(p=>p.id===id)){
    PIPELINE.interested.unshift({id:l.id,src:l.src,title:l.title,budget:l.budget,time:l.time});
  }
  toast("Applied — added to your pipeline");
  render();
}
function showLimit(){
  document.getElementById('page-inner').insertAdjacentHTML('afterbegin',
   `<div id="limitModal" style="position:fixed;inset:0;background:rgba(21,32,26,.5);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px" onclick="if(event.target.id==='limitModal')this.remove()">
      <div style="background:var(--card);border-radius:var(--r-xl);padding:32px;max-width:400px;text-align:center;box-shadow:var(--sh-lg)">
        <div class="empty-icon" style="margin-bottom:16px"><i class="ti ti-bolt"></i></div>
        <h3 class="display" style="font-size:20px;margin-bottom:8px">You've used all 5 free applications</h3>
        <p style="color:var(--slate);font-size:14px;line-height:1.55;margin-bottom:22px">Upgrade to Pro for unlimited applications, direct source links, and analytics — £49/month.</p>
        <button class="btn btn-warm" style="width:100%;margin-bottom:9px" onclick="document.getElementById('limitModal').remove();nav('billing')">See Pro plan</button>
        <button class="btn btn-ghost" style="width:100%" onclick="document.getElementById('limitModal').remove()">Maybe later</button>
      </div></div>`);
}
function emptyFilters(){return `<div class="empty"><div class="empty-icon"><i class="ti ti-filter-off"></i></div><h3>No leads match these filters</h3><p>Try widening your score threshold or switching sources.</p><button class="btn btn-ghost" style="display:inline-flex" onclick="state.scoreFilter='all';state.srcFilter='all';state.search='';render()">Clear filters</button></div>`;}

/* ============ SAVED ============ */
function renderSaved(){
  if(!SAVED.length) return `<div class="empty"><div class="empty-icon"><i class="ti ti-bookmark"></i></div><h3>No saved leads yet</h3><p>Tap the bookmark on any lead to park it here — handy for leads you want to revisit before your application limit resets.</p><button class="btn btn-primary" style="display:inline-flex" onclick="nav('feed')"><i class="ti ti-arrow-left"></i> Browse leads</button></div>`;
  const rows=SAVED.map(id=>{const l=LEADS.find(x=>x.id===id);if(!l)return"";const s=SRC[l.src];const sc=scoreOf(l);
    return `<div class="saved-row">${gaugeSVG(sc)}
      <div class="sr-main"><div class="sr-title">${esc(l.title)}</div><div class="lc-meta" style="margin:0"><span class="src-badge ${s.cls}">${s.name.toUpperCase()}</span><span class="budget">${l.budget}</span><span class="lc-time">${l.time}</span></div></div>
      <button class="btn btn-primary" onclick="nav('feed');setTimeout(()=>selectLead(${l.id}),60)">Open</button>
      <button class="btn-icon tip" data-tip="Remove" aria-label="Remove from saved" style="color:var(--coral)" onclick="toggleSave(${l.id});render()"><i class="ti ti-trash"></i></button></div>`;}).join("");
  return `<div class="greeting"><h2>Saved leads</h2><p>${SAVED.length} bookmarked for later.</p></div><div class="section-card">${rows}</div>`;
}

/* ============ PIPELINE ============ */
function renderPipeline(){
  const cols=[["interested","Interested","var(--lime-deep)"],["applied","Applied","var(--mid)"],["won","Won","var(--hi)"]];
  const total=PIPELINE.interested.length+PIPELINE.applied.length;
  const body=cols.map(([key,label,color])=>{
    const cards=PIPELINE[key].length?PIPELINE[key].map(c=>kanCard(c,key)).join(""):`<div class="kan-empty">Drop leads here</div>`;
    return `<div class="kan-col"><div class="kan-head"><span class="kan-dot" style="background:${color}"></span><span class="kan-title">${label}</span><span class="kan-count">${PIPELINE[key].length}</span></div>
      <div class="kan-body" data-col="${key}">${cards}</div></div>`;
  }).join("");
  return `<div class="greeting"><h2>Pipeline</h2><p>${total} active · ${PIPELINE.won.length} won. Drag cards between stages as things progress.</p></div>
    <div class="kanban">${body}</div>`;
}
function kanCard(c,col){const s=SRC[c.src];
  const stageIdx={interested:0,applied:1,won:2}[col];
  const stageLbl=["Interested","Applied","Won"][stageIdx];
  // Top5p3: visual timeline beats raw status text.
  const track=`<div class="stage-track">
    <span class="stage-dot ${stageIdx>=0?'done':''} ${stageIdx===0?'now':''}"></span>
    <span class="stage-line ${stageIdx>=1?'done':''}"></span>
    <span class="stage-dot ${stageIdx>=1?'done':''} ${stageIdx===1?'now':''}"></span>
    <span class="stage-line ${stageIdx>=2?'done':''}"></span>
    <span class="stage-dot ${stageIdx>=2?'done':''} ${stageIdx===2?'now':''}"></span>
    <span class="stage-lbl">${stageLbl}</span>
  </div>`;
  return `<div class="kan-card" draggable="true" data-id="${c.id}" data-col="${col}">
    <div class="kc-top"><span class="src-ava" style="background:${s.ava};width:18px;height:18px;font-size:9px">${s.ini}</span><span class="src-badge ${s.cls}">${s.name.toUpperCase()}</span><span class="lc-time" style="margin-left:auto">${c.time}</span></div>
    <div class="kc-title">${esc(c.title)}</div>
    <div class="kc-foot"><span class="budget">${c.budget}</span></div>
    ${track}
  </div>`;}

let dragId=null,dragCol=null;
function wireDnD(){
  document.querySelectorAll('.kan-card').forEach(card=>{
    card.addEventListener('dragstart',e=>{dragId=+card.dataset.id;dragCol=card.dataset.col;card.classList.add('dragging');});
    card.addEventListener('dragend',()=>{card.classList.remove('dragging');document.querySelectorAll('.kan-body').forEach(b=>b.classList.remove('dragover'));});
  });
  document.querySelectorAll('.kan-body').forEach(body=>{
    body.addEventListener('dragover',e=>{e.preventDefault();body.classList.add('dragover');});
    body.addEventListener('dragleave',()=>body.classList.remove('dragover'));
    body.addEventListener('drop',e=>{e.preventDefault();const to=body.dataset.col;
      if(dragCol&&to&&dragCol!==to){const idx=PIPELINE[dragCol].findIndex(c=>c.id===dragId);if(idx>=0){const[card]=PIPELINE[dragCol].splice(idx,1);PIPELINE[to].unshift(card);toast(`Moved to ${to.charAt(0).toUpperCase()+to.slice(1)}`);}}
      render();});
  });
}

  <div class="bill-toggle">
    <button class="${billCycle==='monthly'?'on':''}" onclick="billCycle='monthly';render()">Monthly</button>

        <li class="pc-feat"><i class="ti ti-check"></i> Direct source links</li>
        <li class="pc-feat"><i class="ti ti-check"></i> Pipeline analytics</li>
        <li class="pc-feat"><i class="ti ti-check"></i> Priority support</li>
      </ul>
      <button class="btn btn-warm" style="width:100%" ${state.isPro?'disabled style="opacity:.6"':''} onclick="${state.isPro?'':'upgrade()'}">${state.isPro?'Current plan':'Start — '+proPrice+(billCycle==='annual'?'/mo':'/mo')}</button>

      <span class="mono" style="font-size:13px;font-weight:600">${state.isPro?'Unlimited':state.apps+' / 5 applications'}</span>
    </div>
    ${!state.isPro&&state.apps>=4?`<p style="font-size:12.5px;color:var(--coral);margin-top:10px"><i class="ti ti-alert-circle" style="font-size:14px;vertical-align:-2px"></i> You're almost at your monthly limit — upgrade to keep applying.</p>`:""}

}
function upgrade(){state.isPro=true;toast("Welcome to Pro 🎉");render();}
